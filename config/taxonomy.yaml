# Store product types. Starter set of 8; grow to ~30 in Weekend 1.
# Descriptions and keywords are what gets embedded for retrieval,
# so write them the way a supplier might describe the product.

types:
  # ── Live Animals ─────────────────────────────────────────────
  - id: live-animals
    name: "Animals & Pet Supplies > Live Animals"
    description: Live pets and animals sold for ownership, including fish, birds, reptiles, small mammals and live feeder insects.
    keywords: [live animal, live fish, live bird, live reptile, feeder insects, crickets]

  # ── Bird Supplies ────────────────────────────────────────────
