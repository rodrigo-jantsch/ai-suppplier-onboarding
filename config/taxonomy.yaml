    name: "Animals & Pet Supplies >  Pet Supplies > Bird Supplies > Bird Cage Accessories"
    description: Add-ons for bird cages such as covers, seed guards, cups and liners.
    keywords: [cage cover, seed guard, cage cup, cage liner, bird cage accessory]
  - id: bird/cages-stands
    name: "Animals & Pet Supplies >  Pet Supplies > Bird Supplies > Bird Cages & Stands"
    description: Cages, flight cages and stands for housing pet birds.
    keywords: [bird cage, flight cage, parrot cage, cage stand, aviary]
  - id: bird/food
    name: "Animals & Pet Supplies >  Pet Supplies > Bird Supplies > Bird Food"
    description: Seed mixes, pellets and formulated diets for pet birds.
    keywords: [bird seed, bird pellets, parrot food, finch food, cockatiel food]
  - id: bird/gyms-playstands
    name: "Animals & Pet Supplies >  Pet Supplies > Animals & Pet Supplies > Bird Supplies > Bird Gyms & Playstands"
    description: Freestanding or cage-top play areas where birds climb and exercise.
    keywords: [bird gym, play stand, playtop, perch tree]
  - id: bird/ladders-perches
    name: "Animals & Pet Supplies >  Pet Supplies > Bird Supplies > Bird Ladders & Perches"
