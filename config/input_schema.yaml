# The standard input every supplier CSV is mapped to (src/schemas.py InputRow).
#
# columns:    real CSV columns. `aliases` are compared after normalizing headers
#             (lowercase, trimmed, runs of spaces/underscores -> one space),
#             so "Item #", "item_#" and "ITEM #" all match "item #".
# attributes: name/value pairs from AttributeNName / AttributeNValue columns.
#             ingest.py turns those pairs into a dict first, then maps them here.
#
# When a supplier sends an unknown header, ingest.py lists it; add the confirmed
# alias here (later: the LLM proposes one and you approve it).

columns:
  sku:
    required: true
    aliases: [sku, supplier sku, item no, "item #", item number, part no, inventory number]
  upc:
    aliases: [upc, upc code, gtin, barcode, ean]
  brand:
    aliases: [brand]
  manufacturer:
    aliases: [manufacturer, mfr, vendor]
  name:
    required: true
    aliases: [name, item name, product name, title, auction title]
  short_description:
    aliases: [short description, description short]
  description:
    aliases: [desc, description, long desc, features]
  size:
    aliases: [size, pack size, unit size, net wt, net weight]
  cost:
    aliases: [cost, unit cost, wholesale, dealer cost]
  msrp:
    aliases: [msrp, retail, srp, list price, retail price]
  weight_lb:
    aliases: [weight, weight lb, shipping weight]
  height:
    aliases: [height]
  length:
    aliases: [length]
  width:
    aliases: [width]
  parent_sku:
    aliases: [variation parent sku, parent sku, parent item number]
  images:
    aliases: [picture urls, image urls, images]

attributes:
  size: [Jeffers Size, Size]            # first non-empty wins
  country_of_origin: [Country/Region of Manufacturer]
  animal_type: [Animal Type]
  bullets_prefix: "Bullet Point"        # Bullet Point 1..N -> bullets list, in order
